# BSDE training experiment: Pesic-Williams.
name: bsde_pesic_williams
network: configs/net_topology/pesic_williams.yaml
seed: 42

heavy_traffic:
  n: 400
  b: 10.0

bsde:
  horizon: 0.01
  dt: 0.00015625
  num_steps: 64
  num_paths: 256
  train_steps_per_epoch: 5000
  train_epochs: 50
  reference_drift: [-1.0, -1.0, -1.0]  # short-segment reference drift
  loss_scale_by_horizon_sq: true
  bound_curriculum:
    type: linear
    pace: 10
    initial_bound: 0.0
  hidden: [100, 100, 100]
  lr: 1.0e-3
  lr_schedule:
    type: cosine
    alpha: 0.01
    warmup_steps: 0
  weight_decay: 1.0e-3
  clipnorm: 10.0
  grad_nonneg_weight: 1.0
  val_interval: 200
  val_paths: 4096
  log_interval: 200
  ckpt_interval: 1000
  init: zeros
  init_scale: 1.0
  sampling_mode: continuous
  warmup_segments: 1000   # discard first 1000 segments (path 0 -> stationary)
  vmc_paths: 2048
  vmc_horizon: 3.0
  vmc_dt: 0.00015625
  smoke_paths: 64
  smoke_steps: 16
  smoke_horizon: 0.01

reflection:
  backend: newton_lemke

prelimit:
  num_paths: 100000
  num_jumps: 6000
  horizon: 3.0
